[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cambodia-geo"
version = "1.0.1"
description = "Lightweight, zero-dependency lookup of Cambodia's provinces, districts, communes and villages (Khmer, English, codes)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "bsthen" }]
keywords = ["cambodia", "khmer", "geo", "province", "district", "commune", "village", "administrative-divisions"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/bsthen/cambodia-geo-python"
Repository = "https://github.com/bsthen/cambodia-geo-python"
Issues = "https://github.com/bsthen/cambodia-geo-python/issues"
Changelog = "https://github.com/bsthen/cambodia-geo-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cambodia_geo"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/spec", "/README.md", "/LICENSE", "/NOTICE", "/SPEC.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
